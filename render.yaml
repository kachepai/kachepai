services:
  - type: web
    name: kachepai-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "24.21.0"

  - type: web
    name: kachepai-web
    runtime: static
    buildCommand: ""
    staticPublishPath: .
